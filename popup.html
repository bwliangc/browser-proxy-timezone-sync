<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浏览器代理时区同步</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid #334155;
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.72);
      transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }
    .github-link:hover {
      color: #f8fafc;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .github-link svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }
    label {
      display: block;
      margin: 10px 0 6px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }
    input[type="text"], select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      outline: none;
      background: #020617;
      color: #e5e7eb;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }
    button {
      width: 100%;
      height: 38px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.72);
      font-size: 12px;
      line-height: 1.55;
    }
    .muted { color: #94a3b8; }
    .success { color: #86efac; }
    .error { color: #fca5a5; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>浏览器代理时区同步</h1>
    <a class="github-link" href="https://github.com/bwliangc/browser-proxy-timezone-sync" target="_blank" rel="noreferrer" aria-label="打开 GitHub 仓库">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.68 7.68 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
      </svg>
    </a>
  </div>

  <div class="row">
    <span>启用时区伪装</span>
    <input id="enabled" type="checkbox" />
  </div>

  <label for="mode">模式</label>
  <select id="mode">
    <option value="auto">根据出口 IP 自动匹配</option>
    <option value="manual">手动指定时区</option>
  </select>

  <div id="manualTimeZoneField">
    <label for="manualTimeZone">手动时区</label>
    <input id="manualTimeZone" type="text" list="timezoneList" placeholder="Asia/Shanghai" />
    <datalist id="timezoneList"></datalist>
  </div>

  <button id="refreshButton" type="button">刷新 IP 时区</button>

  <div class="card">
    <div>当前：<span id="effectiveTimeZone" class="mono">-</span></div>
    <div>IP：<span id="ip" class="mono">-</span></div>
    <div>来源：<span id="provider" class="mono">-</span></div>
    <div id="status" class="muted">就绪</div>
    <span id="autoTimeZone" hidden></span>
    <span id="candidates" hidden></span>
    <span id="location" hidden></span>
    <span id="fetchedAt" hidden></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
